# =============================================================================
# voice-pipe configuration
#
# Copy this file to config.toml and fill in the values.
# config.toml is in .gitignore. Do not commit tokens.
# Values that you remove use the default that the comment shows.
# =============================================================================

# -----------------------------------------------------------------------------
# General settings
# -----------------------------------------------------------------------------
[general]
# Prefix for the chat commands on both platforms. With "vp!" the commands
# are vp!help, vp!status, vp!toggle, vp!link, vp!confirm, and vp!unlink.
command_prefix = "vp!"

# Start with the bridge on (true) or off (false). vp!toggle changes it.
# After the first toggle, the saved state in state_file is used instead.
start_enabled = true

# File that keeps the on/off state of vp!toggle after a restart. A relative
# path is relative to the working directory. Set "" to not save the state.
state_file = "voice-pipe-state.toml"

# Link voice channels that have the same name on both platforms (outer
# spaces are ignored, but names are case-sensitive). The [[links]] entries
# below are used first.
match_by_name = true

# Do not link the AFK voice channel of either server by name. A [[links]]
# entry can still link an AFK channel. Default true.
ignore_afk_channels = true

# Nickname of a group bot: the main bot (or a proxy, when the main bot is
# busy in another channel) when it speaks for all users of a channel,
# because there are not enough proxies for each user.
overflow_name = "Multiple Users"

# Nickname of a proxy while it mirrors nobody. {number} is the position of
# its token in proxy_tokens (1, 2, 3, ...). Set "" to remove the nickname.
proxy_idle_name = "Voice Pipe Proxy {number}"

# Log filter: error, warn, info, debug, or a tracing filter such as
# "info,voice_pipe=debug". The voice libraries (Songbird, LiveKit, WebRTC)
# log only warnings with this setting, because Songbird writes several
# lines each time a person starts or stops speaking. The RUST_LOG variable
# replaces this value and shows the library logs too.
log_level = "info"

# Log a "receive report" for each Discord speaker every 10 seconds: packets,
# lost packets, levels, clipping, and how much the two channels differ. Use
# it to find audio problems. Only numbers are logged, never audio. Default
# false.
audio_reports = false

# Level that a person's audio must reach to start speech. Quieter background
# noise is not relayed, so the mirrors do not look like an open microphone.
# Quiet sounds inside speech are still relayed. 0 relays all audio.
# Unit: RMS amplitude of 16-bit samples over a 20 ms frame, linear from 0
# (silence) to 32768 (full scale). From dBFS: 32768 x 10^(dBFS / 20).
# 33 = -60 dBFS, 50 = -56 dBFS, 100 = -50 dBFS, 1000 = -30 dBFS (speech).
# Default 50.
voice_threshold = 50

# Time that a bot keeps sending after speech stops, so that the ends of
# words are not cut. The speech gate also uses it. Unit: milliseconds
# (minimum 20). The speech gate counts it in 20 ms frames and rounds down.
# Default 300.
silence_hangover_ms = 300

# Frames (20 ms each) that the overflow mixer buffers for each speaker.
# More frames give more delay but survive larger network problems. Default 3.
jitter_frames = 3

# -----------------------------------------------------------------------------
# Discord
# -----------------------------------------------------------------------------
[discord]
# Server ID: turn on Developer Mode, right-click the server, Copy Server ID.
guild_id = ""

# Token of the main bot. It watches the voice channels, answers the
# commands, and joins voice as "Multiple Users" when there are not enough
# proxies for all users in a channel.
# It needs the Message Content intent (see README).
main_token = ""

# Tokens of the proxy bots. Each proxy copies the name and avatar of one
# Fluxer user while that user is in a linked channel. Use as many as the
# number of Fluxer users that you expect at the same time. Can be empty.
proxy_tokens = [
        # "proxy-token-1",
        # "proxy-token-2",
]

# Discord role IDs that can use toggle, link, confirm, and unlink. The roles
# in fluxer.command_role_ids count too. When both lists are empty, everyone
# can use all commands, so any member can turn the bridge off.
command_role_ids = []

# Discord URLs. You do not need to change these.
# api_url = "https://discord.com/api/v10"
# gateway_url = "wss://gateway.discord.gg/?v=10&encoding=json"

# -----------------------------------------------------------------------------
# Fluxer
# -----------------------------------------------------------------------------
[fluxer]
# Community (guild) ID of your Fluxer community.
guild_id = ""

# Token of the main Fluxer bot. It watches the voice channels, answers the
# commands, and joins voice as "Multiple Users" when there are not enough
# proxies for all users in a channel.
main_token = ""

# Tokens of the Fluxer proxy bots. Each proxy copies the name and avatar of
# one Discord user. Can be empty.
proxy_tokens = [
        # "proxy-token-1",
]

# Fluxer role IDs that can use toggle, link, confirm, and unlink. The roles
# in discord.command_role_ids count too (see above).
command_role_ids = []

# Fluxer URLs. The defaults are for a self-hosted Fluxer on this machine,
# with a stack that binds 127.0.0.1:8080 (FLUXER_EDGE_BIND). The bridge
# then talks to Fluxer directly, not through a reverse proxy.
#
# For the official instance (fluxer.app), use:
#   api_url = "https://api.fluxer.app/v1"
#   gateway_url = "wss://gateway.fluxer.app/?v=1&encoding=json"
#   livekit_url = ""
#   avatar_url = "https://fluxerusercontent.com/avatars/{user_id}/{hash}.png?size=128"
#
# For Fluxer on another machine, use the URLs of that server. Use https://
# and wss://, because the tokens are visible on the network with http://
# and ws://. See "Step 3: Network setup" in the README.
api_url = "http://127.0.0.1:8080/api/v1"
gateway_url = "ws://127.0.0.1:8080/gateway?v=1&encoding=json"

# LiveKit signaling URL for voice. Set it to "" to use the URL that Fluxer
# sends for each call (use "" for any instance that is not on this
# machine).
livekit_url = "ws://127.0.0.1:8080/livekit"

# Avatar image URL. {user_id} and {hash} are replaced. Use the same host and
# path that the Fluxer web app uses for avatars.
avatar_url = "http://127.0.0.1:8080/media/avatars/{user_id}/{hash}.png?size=128"

# Host header for requests to a Fluxer on this machine. Set this to your
# public host name (for example "chat.example.com") if the Fluxer edge
# routes requests by host name and does not answer on 127.0.0.1. Leave
# empty if it is not needed.
host_header = ""

# -----------------------------------------------------------------------------
# Fixed channel links (optional)
# -----------------------------------------------------------------------------
# Link two channels that do not have the same name. Add one block for each
# link. Each channel can be in only one link.
#
# The vp!link, vp!confirm, and vp!unlink commands add and remove these
# blocks while the bridge runs. They append new blocks at the end of this
# file and remove only the block of the link. Other lines do not change.
#
# [[links]]
# discord_channel_id = "123456789012345678"
# fluxer_channel_id = "987654321098765432"
