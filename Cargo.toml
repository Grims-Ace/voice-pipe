[package]
name = "voice-pipe"
version = "0.4.2"
edition = "2024"
description = "Voice bridge between Discord and a self-hosted Fluxer instance."
license = "MIT"
authors = ["Grimsace"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
flume = "0.11"
futures-util = "0.3"
livekit = { version = "0.9", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "receive", "rustls", "tungstenite"] }
# Songbird plays raw PCM through symphonia. These must match the 0.5 line
# that songbird uses, and "pcm" turns on the decoder for raw f32 input.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
symphonia-core = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Songbird 0.6.1 gives the DAVE trailer to the Opus decoder with the audio,
# which damages CELT audio. The patched copy uses the body range from the
# decrypt step. Remove this when a fixed songbird is released.
[patch.crates-io]
songbird = { path = "vendor/songbird" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
